# WPF can't compile anywhere but Windows (the Linux/macOS SDKs ship without
# Microsoft.NET.Sdk.WindowsDesktop), so this is the only pre-tag compile
# check the Windows port gets.
name: Windows CI

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        working-directory: windows
        run: dotnet build src/AgentIsland/AgentIsland.csproj -c Release

      - name: Test
        working-directory: windows
        run: dotnet run --project tests/AgentIsland.Tests -c Release

      # A downloadable test build for every push — lets a maintainer try the
      # branch without cutting a release/tag (which would ship to all users
      # via auto-update). Grab it from the run's Artifacts section.
      - name: Package test build
        working-directory: windows
        run: .\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: AgentIsland-win-x64-test
          path: windows/dist/AgentIsland-*.zip
          if-no-files-found: error

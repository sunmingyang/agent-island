name: Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the Windows zip to"
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build (version = VERSION file)
        shell: pwsh
        working-directory: windows
        run: |
          $v = (Get-Content ..\VERSION -Raw).Trim()
          .\build.ps1 -Version $v

      # The macOS job creates the release (with the Sparkle appcast). Wait for
      # it so a Windows-only release can never occupy `latest` without the
      # appcast — that would 404 every Mac user's auto-update.
      - name: Attach zip once the release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          for i in $(seq 1 30); do
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 20
          done
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$TAG" windows/dist/AgentIsland-*.zip --clobber -R "$GITHUB_REPOSITORY"
